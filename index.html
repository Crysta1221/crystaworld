<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/crysta-avatar.webp" type="image/webp" sizes="192x192" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- og -->
    <title>Crystaworld</title>
    <meta name="description" content="くりすたのポートフォリオへようこそ！" />
    <meta property="og:site_name" content="Crystaworld" />
    <meta property="og:title" content="Crystaworld" />
    <meta property="og:description" content="くりすたのポートフォリオへようこそ！" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crystaworld.dev/" />
    <meta property="og:image" content="https://crystaworld.dev/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- /og -->
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var storedTheme = localStorage.getItem("crystaworld-theme");
        var wantsDark =
          storedTheme === "dark" ||
          (storedTheme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (wantsDark) document.documentElement.classList.add("dark");
        var storedLocale = localStorage.getItem("crystaworld-locale");
        var locale =
          storedLocale === "en" || storedLocale === "ja"
            ? storedLocale
            : (navigator.language || "").toLowerCase().indexOf("en") === 0
              ? "en"
              : "ja";
        document.documentElement.lang = locale;
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
