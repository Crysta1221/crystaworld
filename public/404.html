<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 | Crystaworld</title>
    <link rel="icon" href="/favicon.ico" />
    <!--
      Served by the asset layer with a 404 status for every path that has no file.
      Keep it static: unknown paths must not start the Worker, so bots that scan
      for admin panels and secrets cost nothing here.
    -->
    <style>
      :root {
        --background: #eff1f5;
        --foreground: #4c4f69;
        --muted: #5c5f77;
        --primary: #2a7019;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #24273a;
          --foreground: #cad3f5;
          --muted: #a5adcb;
          --primary: #a6da95;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font-family: "Zen Maru Gothic", system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.7;
      }
      main {
        width: 100%;
        max-width: 32rem;
      }
      .code {
        margin: 0;
        color: var(--primary);
        font-size: 4rem;
        font-weight: 700;
        letter-spacing: 0.05em;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: 1.25rem;
      }
      p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.5rem 1.25rem;
        border-radius: 999px;
        background: var(--primary);
        color: var(--background);
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>ページが見つかりませんでした</h1>
      <p>URLが間違っているか、ページが移動または削除された可能性があります。</p>
      <p lang="en">Page not found. The URL may be mistyped, or the page may have moved or been removed.</p>
      <a href="/">ホームへ戻る / Back to home</a>
    </main>
  </body>
</html>
