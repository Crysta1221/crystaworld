# Content stays in git. Saving on the deployed site commits through GitHub.
# Locally, open /admin/index.html and choose "Work with Local Repository".
# That path writes files on disk and does not commit. Use Chrome or Edge.
locale: ja

backend:
  name: github
  repo: Crysta1221/crystaworld
  branch: main
  # Same Worker as the site. After deploy, set this to the origin with no trailing slash.
  # GitHub OAuth callback: {base_url}/callback
  # base_url: https://crystaworld.example.workers.dev

media_folder: public
public_folder: /

collections:
  - name: categories
    label: Categories
    label_singular: Category
    folder: src/contents/categories
    create: true
    extension: md
    format: frontmatter
    identifier_field: name
    fields:
      - label: Name
        name: name
        widget: string

  - name: tech-tags
    label: Tech Tags
    label_singular: Tech Tag
    folder: src/contents/tech-tags
    create: true
    extension: md
    format: frontmatter
    identifier_field: name
    fields:
      - label: Name
        name: name
        widget: string
      - label: Icon
        name: icon
        widget: image
        required: false
        hint: Saved under public/. Pick an existing file or upload a new one.
      - label: Monochrome
        name: mask
        widget: boolean
        required: false
        default: false
        hint: Turn on when the icon is a single-color mark.
      - label: Wide
        name: wide
        widget: boolean
        required: false
        default: false

  - name: tags
    label: Tags
    label_singular: Tag
    folder: src/contents/tags
    create: true
    extension: md
    format: frontmatter
    identifier_field: name
    fields:
      - label: Name
        name: name
        widget: string
        hint: Text labels for blogs and memos. Separate from Tech Tags.

  - name: blogs
    label: Blogs
    label_singular: Blog
    folder: src/contents/blogs
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: string
        pattern: ["^\\d{4}-\\d{2}$", "Use YYYY-MM"]
      - label: Tags
        name: tags
        widget: relation
        collection: tags
        multiple: true
        required: false
        value_field: name
        display_fields: [name]
        search_fields: [name]
        options_length: 100
        hint: Register a name in the Tags collection. These are separate from Tech Tags.
      - label: Body
        name: body
        widget: markdown

  - name: memos
    label: Memos
    label_singular: Memo
    folder: src/contents/memos
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: string
        pattern: ["^\\d{4}-\\d{2}$", "Use YYYY-MM"]
      - label: Tags
        name: tags
        widget: relation
        collection: tags
        multiple: true
        required: false
        value_field: name
        display_fields: [name]
        search_fields: [name]
        options_length: 100
        hint: Register a name in the Tags collection. These are separate from Tech Tags.
      - label: Body
        name: body
        widget: markdown

  - name: works
    label: Works
    label_singular: Work
    folder: src/contents/works
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - label: Title
        name: title
        widget: string
      - label: Category
        name: category
        widget: relation
        collection: categories
        value_field: name
        display_fields: [name]
        search_fields: [name]
        options_length: 100
        hint: Add or remove categories from the Categories collection.
      - label: Date
        name: date
        widget: string
        pattern: ["^\\d{4}-\\d{2}$", "Use YYYY-MM"]
      - label: Cover
        name: image
        widget: image
      - label: Images
        name: images
        widget: image
        multiple: true
        required: false
        hint: Gallery images, separate from the cover. Reorder them here.
      - label: Tech Tags
        name: tags
        widget: relation
        collection: tech-tags
        multiple: true
        value_field: name
        display_fields: [name]
        search_fields: [name]
        options_length: 100
        hint: Register a name and icon in the Tech Tags collection. Icons are stored in public/.
      - label: Links
        name: links
        widget: list
        required: false
        summary: "{{fields.label}}"
        hint: Buttons shown above the description. Each one needs a label and a URL.
        fields:
          - label: Label
            name: label
            widget: string
          - label: URL
            name: url
            widget: string
      - label: Body
        name: body
        widget: markdown
