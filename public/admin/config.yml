# Content stays in git. Saving on the deployed site commits through GitHub.
# Locally, open /admin/index.html and choose "Work with Local Repository".
# That path writes files on disk and does not commit. Use Chrome or Edge.
locale: ja

backend:
  name: github
  repo: Crysta1221/crystaworld
  branch: main
  # Same Worker as the site. After deploy, set this to the origin with no trailing slash.
  # GitHub OAuth callback: {base_url}/callback
  # base_url: https://crystaworld.example.workers.dev

media_folder: public
public_folder: /

collections:
  - name: blogs
    label: Blogs
    label_singular: Blog
    folder: src/contents/blogs
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: string
        pattern: ["^\\d{4}-\\d{2}$", "Use YYYY-MM"]
      - label: Body
        name: body
        widget: markdown

  - name: works
    label: Works
    label_singular: Work
    folder: src/contents/works
    create: true
    extension: md
    format: frontmatter
    identifier_field: title
    fields:
      - label: Title
        name: title
        widget: string
      - label: Category
        name: category
        widget: string
      - label: Date
        name: date
        widget: string
        pattern: ["^\\d{4}-\\d{2}$", "Use YYYY-MM"]
      - label: Cover
        name: image
        widget: image
      - label: Images
        name: images
        widget: string
        hint: Comma-separated paths, for example /works/a.png, /works/b.png
      - label: Tags
        name: tags
        widget: string
        hint: Comma-separated names, matching the site parser
      - label: URL
        name: url
        widget: string
        required: false
      - label: Body
        name: body
        widget: markdown
